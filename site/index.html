<!DOCTYPE html>
<!-- Page text comes from config/survey.toml [site] via data/aggregates.json. Layout lives here; styling in styles.css. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survey dashboard</title>
  <meta name="description" content="Interactive survey results. Aggregates only.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to results</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <p class="eyebrow" id="site-eyebrow"></p>
        <h1 id="site-title">Loading…</h1>
        <p class="lede" id="site-lede"></p>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <!-- Mobile: compact summary bar that opens the filter sheet -->
  <div class="summary-bar" id="summary-bar">
    <div class="wrap summary-inner">
      <button type="button" class="summary-btn" id="open-filters" aria-controls="controls" aria-expanded="false">
        <span class="summary-text" id="summary-text">Loading…</span>
        <span class="summary-edit">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm4 5h10v2H7zm3 5h4v2h-4z"/></svg>
          Filters
        </span>
      </button>
    </div>
  </div>

  <div class="sheet-backdrop" id="backdrop" hidden></div>

  <section class="controls" id="controls" aria-label="Filters">
    <div class="wrap controls-inner">
      <div class="sheet-head">
        <h2>Filters</h2>
        <button type="button" class="icon-btn" id="close-filters" aria-label="Close filters">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
        </button>
      </div>
      <label class="field">
        <span class="field-label">Indicator</span>
        <select id="indicator"></select>
      </label>
      <fieldset class="field">
        <legend class="field-label">Compare by</legend>
        <div class="chips" id="compare" role="radiogroup"></div>
      </fieldset>
      <label class="field">
        <span class="field-label">Narrow to</span>
        <select id="slice"></select>
      </label>
      <div class="field field-actions">
        <button type="button" class="text-btn" id="reset">Reset</button>
        <button type="button" class="text-btn" id="share">Copy link</button>
        <button type="button" class="primary-btn" id="apply-filters">Show results</button>
      </div>
    </div>
  </section>

  <main id="main" class="wrap">
    <section class="tiles" id="tiles" aria-live="polite"></section>

    <section class="card" aria-labelledby="dot-title">
      <div class="card-head">
        <div>
          <h2 id="dot-title">—</h2>
          <p class="card-sub" id="dot-sub"></p>
        </div>
        <div class="card-tools">
          <div class="seg" role="group" aria-label="Sort order">
            <button type="button" data-sort="natural" aria-pressed="true">Category order</button>
            <button type="button" data-sort="value" aria-pressed="false">Highest first</button>
          </div>
          <div class="seg" role="group" aria-label="View">
            <button type="button" data-view="chart" aria-pressed="true">Chart</button>
            <button type="button" data-view="table" aria-pressed="false">Table</button>
          </div>
          <button type="button" class="text-btn" id="download">Download CSV</button>
        </div>
      </div>
      <div id="dot-chart" class="dot-chart"></div>
      <div id="dot-table" class="table-wrap" hidden></div>
      <p class="key" id="dot-key"></p>
    </section>

    <section class="card" aria-labelledby="heat-title">
      <div class="card-head">
        <div>
          <h2 id="heat-title">All indicators at a glance</h2>
          <p class="card-sub" id="heat-sub"></p>
        </div>
      </div>
      <div class="heat-legend" id="heat-legend"></div>
      <div class="table-wrap heat-wrap" id="heatmap"></div>
      <p class="key">Tap or click an indicator name to chart it. Colour shows the gap from the average for the group you’ve narrowed to, in percentage points.</p>
    </section>

    <section class="card about" aria-labelledby="about-title">
      <h2 id="about-title">How this data is kept confidential</h2>
      <div class="about-grid" id="about"></div>
    </section>
  </main>

  <footer class="wrap site-footer">
    <p id="footer-meta"></p>
  </footer>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
