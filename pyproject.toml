[project]
name = "confidential-survey-dashboard"
version = "1.0.0"
description = "Publish interactive survey dashboards as a static site, with disclosure control and no microdata in the browser."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
]

[dependency-groups]
# Only needed to generate the synthetic demo microdata.
demo = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "faker>=24",
]
dev = [
    "pytest>=8",
    { include-group = "demo" },
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
