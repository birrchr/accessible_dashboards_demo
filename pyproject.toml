[project]
name = "confidential-survey-dashboard"
version = "1.0.0"
description = "Publish interactive survey dashboards as a static site, with disclosure control and no microdata in the browser."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
]

[dependency-groups]
# Only needed to generate the synthetic demo microdata.
demo = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "faker>=24",
]
# Browser-based accessibility tests (axe-core + keyboard/reflow checks). See docs/ACCESSIBILITY.md.
# After `uv sync`, install the browser once:  uv run playwright install chromium
a11y = [
    "playwright==1.63.0",
    "axe-playwright-python>=0.1.8",
]
dev = [
    "pytest>=8",
    { include-group = "demo" },
    { include-group = "a11y" },
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not a11y'"
markers = ["a11y: browser accessibility tests (run with `make test-a11y`)"]
