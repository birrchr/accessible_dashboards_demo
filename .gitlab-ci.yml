# GitLab equivalent of the GitHub workflows: test on every push, publish site/ to
# GitLab Pages from the default branch. (Delete this file if you only use GitHub.)

image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache]

stages: [test, deploy]

test:
  stage: test
  script:
    - uv sync --locked
    - uv run pytest

accessibility:
  stage: test
  # Playwright's image ships Chromium and its system libraries; uv is installed on top.
  image: mcr.microsoft.com/playwright/python:v1.63.0-noble
  before_script:
    - pip install uv
  script:
    - uv sync --locked
    - uv run pytest -m a11y tests/a11y

pages:
  stage: deploy
  script:
    - uv sync --locked
    - uv run pytest tests/test_public_file.py tests/test_i18n.py tests/test_contrast.py
    - cp -r site public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
