# ─────────────────────────────────────────────────────────────────────────────
#  survey.toml — the ONE file you edit to adapt this dashboard to your survey.
#
#  After editing, rebuild the public data file:   make aggregate
#  Then check it is safe to publish:               make test
#  See docs/CUSTOMIZING.md for worked examples, docs/TRANSLATING.md for languages.
#
#  TEXT IN SEVERAL LANGUAGES
#  Any text value can be either:
#     label = "Province"                              ← same text in every language
#     label = { en = "Age group", fr = "Groupe d’âge" } ← one per language
#  `make aggregate` warns about any text that is missing a language.
# ─────────────────────────────────────────────────────────────────────────────

# ── Website ──────────────────────────────────────────────────────────────────
[site]
languages        = ["en", "fr"]   # first visit picks the browser's language if listed, else default_language
default_language = "en"

title   = { en = "How healthy are people in Canada?", fr = "Quel est l’état de santé de la population canadienne?" }
eyebrow = { en = "CanHealth 2024 · Fictitious survey", fr = "CanHealth 2024 · Enquête fictive" }
lede    = { en = "Explore 13 health indicators by province, age, gender, income and education. Pick an indicator, choose how to compare, and narrow to a group if you like.", fr = "Explorez 13 indicateurs de santé selon la province, l’âge, le genre, le revenu et la scolarité. Choisissez un indicateur, la façon de comparer et, au besoin, un groupe précis." }
footer  = { en = "CanHealth 2024 (fictitious survey). Synthetic data for demonstration.", fr = "CanHealth 2024 (enquête fictive). Données synthétiques à des fins de démonstration." }

# Accessibility feedback (required by AODA IASR s.11). Shown in the footer and accessibility statement.
accessibility_contact = "accessibility@example.org"

# Default view when someone opens the page with no link parameters.
default_indicator = "srh_good"
default_compare   = "province"

# ── Where the private microdata lives ────────────────────────────────────────
# This file is read ONLY by the build step. It is never copied into site/.
[source]
path   = "data/raw/microdata.parquet"
format = "parquet"              # "parquet" | "csv" | "delta" (a Delta table folder)
weight = "survey_weight"        # column with survey weights; use "" for unweighted

# ── Disclosure control ───────────────────────────────────────────────────────
# Raising any of these makes the output safer and sparser. See docs/DISCLOSURE.md.
[rules]
min_cell   = 10                 # hide any group with fewer respondents than this
min_event  = 3                  # hide a % when fewer than this many people are on either side of it
round_base = 5                  # round published respondent counts to this base
cv_e       = 16.6               # CV (%) above which an estimate gets an "E" (use with caution)
cv_f       = 33.3               # CV (%) above which an estimate is hidden

# ── Dimensions: the "Compare by" and "Narrow to" options ─────────────────────
# column = column name in the microdata (or a new name, if you use `expr`)
# expr   = OPTIONAL SQL to compute the groups, e.g. banding a numeric age:
#          expr = "CASE WHEN age < 35 THEN 'Under 35' ELSE '35+' END"
# label  = what users see
# levels = values to show, in display order. Values not listed are ignored.
#          Each is either the raw value ("Ontario") or a table that gives display
#          text per language: { value = "PEI", en = "Prince Edward Island", fr = "Île-du-Prince-Édouard" }
#          (a missing language falls back to `value`).
#          Leave levels out to use every value found, sorted alphabetically.
# The order of the [[dimensions]] blocks is the order of the "Compare by" chips.

[[dimensions]]
column = "province"
label  = { en = "Province or territory", fr = "Province ou territoire" }
levels = [
  { value = "Newfoundland",     en = "Newfoundland and Labrador", fr = "Terre-Neuve-et-Labrador" },
  { value = "PEI",              en = "Prince Edward Island",      fr = "Île-du-Prince-Édouard" },
  { value = "Nova Scotia",                                        fr = "Nouvelle-Écosse" },
  { value = "New Brunswick",                                      fr = "Nouveau-Brunswick" },
  { value = "Quebec",                                             fr = "Québec" },
  "Ontario",
  "Manitoba",
  "Saskatchewan",
  "Alberta",
  { value = "British Columbia",                                   fr = "Colombie-Britannique" },
  { value = "Territories",                                        fr = "Territoires" },
]

[[dimensions]]
column = "age_group"
label  = { en = "Age group", fr = "Groupe d’âge" }
levels = [
  { value = "18–24", fr = "18 à 24 ans" },
  { value = "25–34", fr = "25 à 34 ans" },
  { value = "35–44", fr = "35 à 44 ans" },
  { value = "45–54", fr = "45 à 54 ans" },
  { value = "55–64", fr = "55 à 64 ans" },
  { value = "65–74", fr = "65 à 74 ans" },
  { value = "75+",   fr = "75 ans et plus" },
]

[[dimensions]]
column = "gender"
label  = { en = "Gender", fr = "Genre" }
levels = [
  { value = "Woman",              fr = "Femme" },
  { value = "Man",                fr = "Homme" },
  { value = "Non-binary / Other", en = "Non-binary or other", fr = "Non binaire ou autre" },
  { value = "Prefer not to say",  fr = "Préfère ne pas répondre" },
]

[[dimensions]]
column = "income_bracket"
label  = { en = "Household income", fr = "Revenu du ménage" }
levels = [
  { value = "Under $30K",   en = "Under $30,000",       fr = "Moins de 30 000 $" },
  { value = "$30K–$59K",    en = "$30,000 to $59,999",  fr = "30 000 $ à 59 999 $" },
  { value = "$60K–$99K",    en = "$60,000 to $99,999",  fr = "60 000 $ à 99 999 $" },
  { value = "$100K–$149K",  en = "$100,000 to $149,999", fr = "100 000 $ à 149 999 $" },
  { value = "$150K+",       en = "$150,000 or more",    fr = "150 000 $ et plus" },
]

[[dimensions]]
column = "education"
label  = { en = "Education", fr = "Scolarité" }
levels = [
  { value = "Less than high school",                fr = "Moins qu’un diplôme d’études secondaires" },
  { value = "High school diploma",                  fr = "Diplôme d’études secondaires" },
  { value = "College / trades", en = "College or trades", fr = "Collège ou métiers" },
  { value = "Undergraduate degree",                 fr = "Baccalauréat" },
  { value = "Graduate degree",                      fr = "Diplôme d’études supérieures" },
]

# ── Indicators: what gets measured ───────────────────────────────────────────
# Every indicator is "% of people for whom `when` is true".
# id     = short unique key (letters, digits, underscore). Appears in shared links.
# label  = full name (chart titles, dropdown)
# short  = compact name (heatmap column headers, tiles)
# theme  = groups the dropdown into sections
# better = "higher" or "lower": which direction is good (colours the heatmap)
# when   = a DuckDB SQL condition over the microdata columns. Rows where it is
#          NULL are excluded from that indicator's denominator.

[[indicators]]
id     = "srh_good"
label  = { en = "Very good or excellent health", fr = "Santé très bonne ou excellente" }
short  = { en = "Very good / excellent health", fr = "Santé très bonne / excellente" }
theme  = { en = "General health", fr = "Santé générale" }
better = "higher"
when   = "self_rated_health IN ('Very good', 'Excellent')"

[[indicators]]
id     = "any_chronic"
label  = { en = "Has a chronic condition", fr = "A une maladie chronique" }
short  = { en = "Any chronic condition", fr = "Maladie chronique" }
theme  = { en = "Chronic conditions", fr = "Maladies chroniques" }
better = "lower"
when   = "any_chronic = 1"

[[indicators]]
id     = "hypertension"
label  = { en = "High blood pressure", fr = "Hypertension artérielle" }
short  = { en = "High blood pressure", fr = "Hypertension" }
theme  = { en = "Chronic conditions", fr = "Maladies chroniques" }
better = "lower"
when   = "hypertension = 1"

[[indicators]]
id     = "diabetes"
label  = { en = "Diabetes", fr = "Diabète" }
short  = { en = "Diabetes", fr = "Diabète" }
theme  = { en = "Chronic conditions", fr = "Maladies chroniques" }
better = "lower"
when   = "diabetes = 1"

[[indicators]]
id     = "arthritis"
label  = { en = "Arthritis", fr = "Arthrite" }
short  = { en = "Arthritis", fr = "Arthrite" }
theme  = { en = "Chronic conditions", fr = "Maladies chroniques" }
better = "lower"
when   = "arthritis = 1"

[[indicators]]
id     = "heart_disease"
label  = { en = "Heart disease", fr = "Maladie cardiaque" }
short  = { en = "Heart disease", fr = "Maladie cardiaque" }
theme  = { en = "Chronic conditions", fr = "Maladies chroniques" }
better = "lower"
when   = "heart_disease = 1"

[[indicators]]
id     = "depression"
label  = { en = "Depression", fr = "Dépression" }
short  = { en = "Depression", fr = "Dépression" }
theme  = { en = "Mental health", fr = "Santé mentale" }
better = "lower"
when   = "depression = 1"

[[indicators]]
id     = "anxiety"
label  = { en = "Anxiety", fr = "Anxiété" }
short  = { en = "Anxiety", fr = "Anxiété" }
theme  = { en = "Mental health", fr = "Santé mentale" }
better = "lower"
when   = "anxiety = 1"

[[indicators]]
id     = "obesity"
label  = { en = "Obesity (BMI 30 or more)", fr = "Obésité (IMC de 30 ou plus)" }
short  = { en = "Obesity", fr = "Obésité" }
theme  = { en = "Lifestyle", fr = "Habitudes de vie" }
better = "lower"
when   = "bmi >= 30"

[[indicators]]
id     = "active"
label  = { en = "Active 150+ minutes a week", fr = "Actif 150 minutes ou plus par semaine" }
short  = { en = "Active 150+ min/week", fr = "Actif 150+ min/sem." }
theme  = { en = "Lifestyle", fr = "Habitudes de vie" }
better = "higher"
when   = "physical_activity LIKE 'Moderate%' OR physical_activity LIKE 'High%'"

[[indicators]]
id     = "smoker"
label  = { en = "Currently smokes", fr = "Fume actuellement" }
short  = { en = "Current smoker", fr = "Fumeur actuel" }
theme  = { en = "Lifestyle", fr = "Habitudes de vie" }
better = "lower"
when   = "smoking_status LIKE 'Current%'"

[[indicators]]
id     = "family_doctor"
label  = { en = "Has a family doctor", fr = "A un médecin de famille" }
short  = { en = "Has family doctor", fr = "Médecin de famille" }
theme  = { en = "Access to care", fr = "Accès aux soins" }
better = "higher"
when   = "has_family_doctor = 1"

[[indicators]]
id     = "unmet_need"
label  = { en = "Unmet health care need", fr = "Besoin de soins de santé non comblé" }
short  = { en = "Unmet care need", fr = "Besoin non comblé" }
theme  = { en = "Access to care", fr = "Accès aux soins" }
better = "lower"
when   = "unmet_care_need = 1"
